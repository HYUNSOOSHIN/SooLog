version: 2
updates:
    # SHA로 고정한 액션도 새 버전이 나오면 PR로 알려줌
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      # 자동 머지라서 악성 릴리스가 걸러질 시간을 둠
      cooldown:
          default-days: 7

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      # Gatsby 5는 React 18 기준이라 메이저 업그레이드는 제외
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
      groups:
          npm-minor-patch:
              update-types: [minor, patch]

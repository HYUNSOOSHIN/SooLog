# Dependabot PR을 빌드해보고 통과하면 자동 머지 후 배포
name: Dependabot auto-merge

on: pull_request

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - run: yarn build

    # 의존성 코드를 실행하는 build와 분리해 쓰기 권한은 이 job에만 부여
    merge:
        needs: build
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            actions: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
        steps:
            - run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
            # GITHUB_TOKEN으로 머지한 push는 deploy를 트리거하지 않아서 직접 실행
            - run: gh workflow run deploy.yml --ref master
